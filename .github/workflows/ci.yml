name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      pgpool_version:
        description: 'Pgpool version to build (e.g., 4.7.1)'
        required: true
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

permissions:
  contents: write
  packages: write

env:
  DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/pgpool

jobs:
  publish_docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Only use matrix for automatic builds (push events)
        version: ${{ github.event_name == 'push' && fromJSON('["4.5.11", "4.6.6", "4.7.1"]') || fromJSON('["manual"]') }}
    
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.pgpool_version }}" >> $GITHUB_OUTPUT
            echo "platforms=${{ inputs.platforms }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ matrix.version }}" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: ./pgpool.docker/
          file: ./pgpool.docker/Dockerfile.pgpool
          build-args: |
            PGPOOL_VER=${{ steps.version.outputs.version }}
          push: true
          platforms: ${{ steps.version.outputs.platforms }}
          tags: |
            ${{ env.DOCKER_REPO }}:${{ steps.version.outputs.version }}
